name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests

  self-test:
    name: Run the action on sample results
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Passing suite
        id: ok
        uses: ./
        with:
          junit-path: tests/fixtures/pass.xml
          title: Sample - passing suite
          fail-on-failure: "true"
      - name: Mixed suite (failures and a flaky test)
        id: mixed
        uses: ./
        with:
          junit-path: tests/fixtures/mixed.xml
          title: Sample - failures and flaky test
      - name: Check outputs
        run: |
          test "${{ steps.ok.outputs.failed }}" = "0"
          test "${{ steps.mixed.outputs.failed }}" = "1"
